name: CI

on:
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest ruff

      - name: Run Ruff error checks
        run: python -m ruff check src scripts tests

      - name: Test quality tooling and workflow contracts
        run: >-
          python -m pytest -q
          tests/test_quality_pytest_shards.py
          tests/test_quality_configuration.py
          tests/test_quality_ci_workflow.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        run: npm ci --prefix web

      - name: Check Web
        run: npm -C web run check

      - name: Test Web
        run: npm -C web test

      - name: Build Web bundle
        run: npm -C web run build

      - name: Upload Web bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundled-web
          path: web/dist
          if-no-files-found: error

  python-tests:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Web bundle
        uses: actions/download-artifact@v8
        with:
          name: bundled-web
          path: src/cccc/ports/web/dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest pytest-timeout

      - name: Run stable Python test shard
        shell: bash
        run: |
          mapfile -t TEST_FILES < <(python scripts/quality/pytest_shards.py --total 2 --index "${{ matrix.shard }}")
          test "${#TEST_FILES[@]}" -gt 0
          env -u CCCC_GROUP_ID -u CCCC_ACTOR_ID python -m pytest -q --timeout=120 --timeout-method=thread --durations=20 "${TEST_FILES[@]}"

  python-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up oldest supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CCCC
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Verify supported Python runtime
        run: |
          python -W error::SyntaxWarning -m compileall -q src/cccc
          cccc version
          python - <<'PY'
          import json
          import subprocess

          proc = subprocess.Popen(
              ["cccc", "mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert proc.stdin is not None
          assert proc.stdout is not None

          proc.stdin.write(json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}) + "\n")
          proc.stdin.flush()
          response = json.loads(proc.stdout.readline().strip())
          assert response.get("result", {}).get("serverInfo", {}).get("name") == "cccc-mcp"
          proc.terminate()
          proc.wait(timeout=5)
          print("OK: CCCC import, CLI, and MCP handshake")
          PY

  package:
    needs: [quality, python-tests, python-compat, interop]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify Rust-only release packaging tools
        run: |
          python -m pip install -U pip twine pytest pyyaml
          python -m pytest -q \
            tests/test_build_native_wheel.py \
            tests/test_build_standalone_archive.py \
            tests/test_verify_release_set.py \
            tests/test_smoke_wheel_frontdoor.py
          mkdir -p native-wheel-smoke
          python scripts/build_native_wheel.py \
            /bin/true \
            --platform-tag linux_x86_64 \
            --output-dir native-wheel-smoke
          native_wheel="$(find native-wheel-smoke -maxdepth 1 -name '*.whl' -print -quit)"
          python scripts/verify_native_wheel.py \
            "$native_wheel" \
            --platform-tag linux_x86_64 \
            --binary /bin/true
          python -m twine check "$native_wheel"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("native-wheel-smoke").glob("*.whl"))
          assert "-py3-none-linux_x86_64.whl" in wheel.name, wheel
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert not any(name.endswith((".py", ".pyc")) for name in names)
              assert not any(name.startswith("cccc/") for name in names)
              assert any(name.endswith(".data/scripts/cccc") for name in names)
          print("OK: CI exercises only the Rust-only release wheel shape")
          PY

  windows-smoke:
    needs: web
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Web bundle
        uses: actions/download-artifact@v8
        with:
          name: bundled-web
          path: web/dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest pytest-timeout

      - name: Run Windows PTY smoke tests
        timeout-minutes: 10
        run: >-
          python -m pytest -q --timeout=90 --timeout-method=thread
          tests/test_socket_special_ops.py tests/test_windows_pty_backend.py
          tests/test_installation_diagnostics.py tests/test_system_cmds_doctor.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Verify combined Web startup failure releases its daemon
        timeout-minutes: 10
        run: >-
          cargo test --package cccc --test integration --locked
          daemon_self_launch::combined_web_bind_failure_stops_its_owned_daemon
          -- --test-threads=1

      - name: Verify abrupt daemon process-tree cleanup
        timeout-minutes: 10
        run: >-
          cargo test --package cccc-pair-daemon --lib --locked
          process_tree::tests::abrupt_daemon_exit_reaps_child_and_grandchild_without_deleting_history
          -- --test-threads=1

  rust-linux:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bundled-web
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test installer and release assets
        run: |
          scripts/tests/install_unix.sh
          scripts/tests/release_assets.sh
      - name: Test Rust workspace
        run: |
          # The dedicated interop job owns tests that execute src/cccc. Keep
          # this Rust-only job independent of a Python installation. Process
          # lifecycle tests run serially in the final step because they spawn
          # and stop a combined daemon/Web process.
          cargo test --workspace --exclude cccc-pair-daemon --locked -- \
            --skip python_interop_ \
            --skip daemon_self_launch::
          cargo test --package cccc-pair-daemon --locked -- \
            --test-threads=1 \
            --skip python_interop_
      - name: Test combined daemon and Web process lifecycle serially
        run: >-
          cargo test --package cccc --test integration --locked
          daemon_self_launch:: -- --test-threads=1

  interop:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCCC_TEST_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Web bundle
        uses: actions/download-artifact@v8
        with:
          name: bundled-web
          path: web/dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Python implementation
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Test shared Python and Rust persisted contracts
        run: |
          touch web/dist/index.html
          cargo test -p cccc-pair-core --test context_python_interop --locked
          cargo test -p cccc-pair-core --test group_bridge_identity_interop --locked
          cargo test -p cccc-pair-core --test runtime_hook_interop --locked
          cargo test -p cccc-pair-core --test runtime_hook_identity_interop --locked
          cargo test -p cccc-pair-core --test ledger_python_interop --locked
          cargo test -p cccc-pair-core --test shared_integration_state_interop --locked
          cargo test -p cccc-pair-daemon --test python_storage_interop --locked -- --test-threads=1

  ci-required:
    if: always()
    needs:
      - quality
      - web
      - python-tests
      - python-compat
      - package
      - windows-smoke
      - rust-linux
      - interop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI jobs
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        shell: bash
        run: |
          failures="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | "\(.key)=\(.value.result)"
            ' <<<"$NEEDS_CONTEXT"
          )"
          if [[ -n "$failures" ]]; then
            echo "Required CI jobs did not succeed:"
            echo "$failures"
            exit 1
          fi
          echo "All required CI jobs succeeded."
