name: CI

on:
  push:
    branches: [main, rust]
  pull_request:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest ruff

      - name: Run Ruff error checks
        run: python -m ruff check src scripts tests

      - name: Test quality tooling and workflow contracts
        run: >-
          python -m pytest -q
          tests/test_quality_pytest_shards.py
          tests/test_quality_configuration.py
          tests/test_quality_ci_workflow.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        run: npm ci --prefix web

      - name: Check Web
        run: npm -C web run check

      - name: Test Web
        run: npm -C web test

      - name: Build Web bundle
        run: npm -C web run build

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundled-web
          path: web/dist
          if-no-files-found: error

  python-tests:
    if: github.event_name != 'schedule'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: bundled-web
          path: src/cccc/ports/web/dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest pytest-timeout

      - name: Run stable Python test shard
        shell: bash
        run: |
          mapfile -t TEST_FILES < <(python scripts/quality/pytest_shards.py --total 4 --index "${{ matrix.shard }}")
          test "${#TEST_FILES[@]}" -gt 0
          env -u CCCC_GROUP_ID -u CCCC_ACTOR_ID python -m pytest -q -m "not packaged_web_dist" --timeout=120 --timeout-method=thread --durations=20 "${TEST_FILES[@]}"

  python-compat:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CCCC
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Verify supported Python runtime
        run: |
          python -W error::SyntaxWarning -m compileall -q src/cccc
          cccc version
          python - <<'PY'
          import json
          import subprocess

          proc = subprocess.Popen(
              ["cccc", "mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          assert proc.stdin is not None
          assert proc.stdout is not None

          proc.stdin.write(json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}) + "\n")
          proc.stdin.flush()
          response = json.loads(proc.stdout.readline().strip())
          assert response.get("result", {}).get("serverInfo", {}).get("name") == "cccc-mcp"
          proc.terminate()
          proc.wait(timeout=5)
          print("OK: CCCC import, CLI, and MCP handshake")
          PY

  package:
    if: github.event_name != 'schedule'
    needs: [quality, web, python-tests, python-compat, interop]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: bundled-web
          path: src/cccc/ports/web/dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and check package
        run: |
          python -m pip install -U pip build twine pytest
          python -W error::SyntaxWarning -m compileall -q src/cccc
          python -m build
          python -m twine check dist/*

      - name: Smoke test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cccc version
          python - <<'PY'
          import importlib.resources as ir

          web_index = ir.files("cccc.ports.web").joinpath("dist/index.html")
          help_md = ir.files("cccc.resources").joinpath("cccc-help.md")

          assert web_index.is_file(), f"missing bundled web UI: {web_index}"
          assert help_md.is_file(), f"missing bundled help playbook: {help_md}"
          print("OK: bundled web UI + help playbook")
          PY

      - name: Verify packaged Web bundle contract
        run: python -m pytest -q -m packaged_web_dist tests/test_web_manifest_static.py

      - name: Verify native wheel staging stays platform-scoped
        run: |
          mkdir -p native-wheel-smoke pure-after-native
          CCCC_BUILD_RUST_BINARY=/bin/true \
            CCCC_BUILD_WHEEL_TAG=linux_x86_64 \
            python -m build --wheel --outdir native-wheel-smoke
          native_wheel="$(find native-wheel-smoke -maxdepth 1 -name '*.whl' -print -quit)"
          python scripts/verify_native_wheel.py "$native_wheel" --platform-tag linux_x86_64
          python -m build --wheel --outdir pure-after-native
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("pure-after-native").glob("*.whl"))
          assert wheel.name.endswith("-py3-none-any.whl"), wheel
          with zipfile.ZipFile(wheel) as archive:
              assert not any(
                  name.endswith(("cccc-rust", "cccc-rust.exe"))
                  for name in archive.namelist()
              )
          print("OK: native wheel does not contaminate a later universal build")
          PY

  windows-smoke:
    if: github.event_name != 'schedule'
    needs: web
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: bundled-web
          path: web/dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest pytest-timeout

      - name: Run Windows PTY smoke tests
        timeout-minutes: 10
        run: >-
          python -m pytest -q --timeout=90 --timeout-method=thread
          tests/test_socket_special_ops.py tests/test_windows_pty_backend.py
          tests/test_installation_diagnostics.py tests/test_system_cmds_doctor.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build native Windows installer fixture
        run: cargo build --release --locked -p cccc --bin cccc

      - name: Test Windows installer ownership and PATH handling
        shell: pwsh
        timeout-minutes: 15
        run: scripts/tests/install_windows.ps1

  rust:
    if: github.event_name != 'schedule'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundled-web
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test installer and release assets
        run: |
          scripts/tests/install_unix.sh
          scripts/tests/release_assets.sh
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: |
          # These legacy cross-language tests still execute src/cccc. Keep the
          # Rust job Python-free while they are replaced with checked-in fixtures.
          cargo test --workspace --exclude cccc-pair-daemon --locked -- \
            --skip python_and_rust_share_context_tasks_and_version_state \
            --skip python_and_rust_share_identity_and_signed_session_hello \
            --skip python_and_rust_processes_share_paths_files_and_locks \
            --skip python_and_rust_share_launch_identity_format \
            --skip rust_append_waits_for_the_python_ledger_lock
          cargo test --package cccc-pair-daemon --locked -- \
            --test-threads=1 \
            --skip python_and_rust_share_persisted_control_plane_state \
            --skip python_and_rust_accept_each_others_group_copy_packages
      - name: Build and verify Rust distribution
        run: |
          cargo build --workspace --release --locked
          scripts/tests/install_real_unix.sh target/release/cccc
          target/release/cccc --version
          bash scripts/tests/smoke_rust_replacement.sh target/release/cccc

  interop:
    if: github.event_name != 'schedule'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCCC_TEST_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: bundled-web
          path: web/dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Python implementation
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Test shared Python and Rust persisted contracts
        run: |
          touch web/dist/index.html
          cargo test -p cccc-pair-core --test context_python_interop --locked
          cargo test -p cccc-pair-core --test group_bridge_identity_interop --locked
          cargo test -p cccc-pair-core --test runtime_hook_interop --locked
          cargo test -p cccc-pair-core --test runtime_hook_identity_interop --locked
          cargo test -p cccc-pair-core --test ledger_python_interop --locked
          cargo test -p cccc-pair-daemon --test python_storage_interop --locked -- --test-threads=1

  nightly-serial:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest pytest-timeout

      - name: Run full Python suite serially
        timeout-minutes: 30
        run: >-
          env -u CCCC_GROUP_ID -u CCCC_ACTOR_ID python -m pytest tests/ -q -m "not packaged_web_dist" --timeout=120 --timeout-method=thread --durations=20
