name: CI

on:
  push:
    branches: [main, rust]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Installer and release asset tests
        run: |
          scripts/tests/install_unix.sh
          scripts/tests/release_assets.sh
      - name: Build embedded Web UI
        run: |
          npm ci --prefix web
          npm -C web run lint
          npm -C web run typecheck
          npm -C web run build
          test -f web/dist/index.html
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Test real Unix distribution installer
        run: scripts/tests/install_real_unix.sh target/release/cccc
      - name: CLI smoke
        run: |
          target/release/cccc --version
          target/release/cccc --help | grep -E 'daemon|mcp|web'

  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build embedded Web UI
        shell: bash
        run: |
          npm ci --prefix web
          npm -C web run build
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build platform distribution for installer test
        run: cargo build --release --locked -p cccc-cli --bin cccc
      - name: Test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/tests/install_unix.sh
          scripts/tests/install_real_unix.sh target/release/cccc
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/tests/install_windows.ps1
