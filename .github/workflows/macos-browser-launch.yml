name: macOS busy browser navigation and maintenance
on:
  push:
    branches: [probe/macos-browser-launch]
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: macos-15
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Check background document navigation with and without Chromium's test keychain
        timeout-minutes: 7
        run: python3 -BI scripts/tests/macos_launch/navigation.py "$RUNNER_TEMP/cccc-busy-direct/evidence/navigation"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Prepare pinned sources, macOS SDK inspector and Web assets
        timeout-minutes: 8
        run: bash scripts/tests/macos_launch/direct.sh prepare
      - name: Build the previous program with its isolated headless launcher
        timeout-minutes: 20
        run: bash scripts/tests/macos_launch/direct.sh build previous
      - id: built
        name: Build the pinned candidate and verify separate source identities
        timeout-minutes: 20
        run: bash scripts/tests/macos_launch/direct.sh build current
      - id: daemon_case
        name: Replace the daemon during a browser response
        if: ${{ !cancelled() && steps.built.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          rc=0
          bash scripts/tests/macos_launch/direct.sh case daemon || rc=$?
          if test -s "$RUNNER_TEMP/cccc-busy-direct/evidence/results/daemon/first-submitted.json"; then
            echo "busy=yes" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: Restart the local build during a browser response
        if: ${{ !cancelled() && steps.built.outcome == 'success' && steps.daemon_case.outputs.busy == 'yes' }}
        timeout-minutes: 8
        run: bash scripts/tests/macos_launch/direct.sh case local
      - name: Install the release during a browser response
        if: ${{ !cancelled() && steps.built.outcome == 'success' && steps.daemon_case.outputs.busy == 'yes' }}
        timeout-minutes: 8
        run: bash scripts/tests/macos_launch/direct.sh case release
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-direct-busy-browser-evidence
          if-no-files-found: warn
          retention-days: 5
          path: ${{ runner.temp }}/cccc-busy-direct/evidence
