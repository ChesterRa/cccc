name: Apple Silicon Web update handover
on:
  push:
    branches: [probe/macos-maintenance-runtimes]
permissions:
  contents: read
  actions: read
jobs:
  retention:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { direction: current-host, source: current, target: previous, label: Final Web host initiates Keep }
          - { direction: current-target, source: previous, target: current, label: Final Web host receives Keep }
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44462655017
          name: cccc-apple-silicon-previous
          path: ${{ runner.temp }}/archives/cccc-apple-silicon-previous
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44462655017
          name: cccc-apple-silicon-current
          path: ${{ runner.temp }}/archives/cccc-apple-silicon-current
      - name: Verify and unpack the tested Apple Silicon archives
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/archives/cccc-apple-silicon-current/product-commit.txt")" = 6398401fe70aa16f8d085b99a0386d58749bf046
          test "$(cat "$RUNNER_TEMP/archives/cccc-apple-silicon-previous/product-commit.txt")" = 4bdab600f31f4d3be5f7b84790719138105e503c
          test "$(cat "$RUNNER_TEMP/archives/cccc-apple-silicon-current/SHA256SUMS")" = '28a367b1a2e40d1b917b32342b4b5b2add204c7695580a92b1b2e79ccb203d98  cccc-v0.4.58+6398401f-aarch64-apple-darwin.tar.gz'
          test "$(cat "$RUNNER_TEMP/archives/cccc-apple-silicon-previous/SHA256SUMS")" = '7775502712641be3d7022a7d3b4a2d0bcc57caf5f8021a8a26998dd4e0b340e6  cccc-v0.4.58+4bdab600-aarch64-apple-darwin.tar.gz'
          for role in previous current; do
            pkg="$RUNNER_TEMP/archives/cccc-apple-silicon-$role"
            (cd "$pkg" && shasum -a 256 -c SHA256SUMS)
            files=("$pkg"/*.tar.gz)
            test "${#files[@]}" -eq 1
            dst="$RUNNER_TEMP/bin/$role"
            mkdir -p "$dst"
            tar -xzf "${files[0]}" -C "$dst" --strip-components=1
            "$dst/cccc" update --self-check > "$dst/observed.json"
            cmp "$dst/observed.json" "$pkg/self-check.json"
          done
          xcrun --sdk macosx clang -std=c11 -D_DARWIN_C_SOURCE -Wall -Wextra -Werror \
            scripts/tests/macos_maintenance/inspect_process.c -o "$RUNNER_TEMP/inspect-process"
      - name: Check out the original Web fixture and previous target installer
        uses: actions/checkout@v7
        with:
          ref: 4bdab600f31f4d3be5f7b84790719138105e503c
          path: previous-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install.sh
            /scripts/tests/macos_maintenance/update_keep.py
            /scripts/tests/macos_maintenance/maintenance_mcp_member.py
      - name: Exercise local restart and release update through the Web host
        shell: bash
        env:
          SOURCE_ROLE: ${{ matrix.source }}
          TARGET_ROLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/previous-source/scripts/tests/macos_maintenance/update_keep.py"
          out="$RUNNER_TEMP/evidence"
          mkdir -p "$out"
          # The fixture serves the destination build's installer from the working directory.
          if [ "$TARGET_ROLE" = previous ]; then cd "$GITHUB_WORKSPACE/previous-source"; fi
          root=$(mktemp -d /tmp/cccc-isolated.XXXXXXXX)
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root"/{home,cccc,tmp,codex,claude}
          python=$(command -v python3)
          failed=0
          for action in local release; do
            if ! env -i PATH=/usr/bin:/bin:/usr/sbin LANG=C HOME="$root/home" \
              TMPDIR="$root/tmp" CCCC_HOME="$root/cccc" CODEX_HOME="$root/codex" \
              CLAUDE_CONFIG_DIR="$root/claude" CCCC_TEST_SDK_INSPECTOR="$RUNNER_TEMP/inspect-process" \
              "$python" -I "$fixture" "$RUNNER_TEMP/bin/$SOURCE_ROLE/cccc" \
              "$RUNNER_TEMP/bin/$TARGET_ROLE/cccc" "$out" "$action" 2>&1 | tee "$out/$action.log"; then
              failed=1
            fi
            test -s "$out/$action/result.json" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macos-web-relay-${{ matrix.direction }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 7
