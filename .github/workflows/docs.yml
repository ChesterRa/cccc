name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/prepare_docs_installers.mjs'
      - 'scripts/resolve_docs_installer_version.mjs'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: ['Release CCCC']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Resolve latest complete stable installer release
        id: installer-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "version=$(node scripts/resolve_docs_installer_version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build with VitePress
        env:
          CCCC_DOCS_INSTALL_VERSION: ${{ steps.installer-release.outputs.version }}
        run: npm run build
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
