name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Verify tag version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build Web UI
        shell: bash
        run: |
          npm ci --prefix web
          npm -C web run build
      - name: Build Rust binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Resolve package name
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "PACKAGE_NAME=cccc-v${version}-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p "dist/${PACKAGE_NAME}"
          cp target/${{ matrix.target }}/release/{cccc,ccccd,cccc-mcp,cccc-web} "dist/${PACKAGE_NAME}/"
          cp LICENSE README.md docs/rust-migration.md "dist/${PACKAGE_NAME}/"
          tar -C dist -czf "dist/${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = $env:PACKAGE_NAME
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cccc.exe","target/${{ matrix.target }}/release/ccccd.exe","target/${{ matrix.target }}/release/cccc-mcp.exe","target/${{ matrix.target }}/release/cccc-web.exe" "dist/$name/"
          Copy-Item LICENSE,README.md,docs/rust-migration.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cccc-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
