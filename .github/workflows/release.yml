name: Release CCCC

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        run: |
          npm ci --prefix web
          npm -C web run build
          rm -rf src/cccc/ports/web/dist
          mkdir -p src/cccc/ports/web/dist
          cp -R web/dist/. src/cccc/ports/web/dist/
          test -f src/cccc/ports/web/dist/index.html

      - name: Verify shared release identity
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            python scripts/check_release_versions.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_release_versions.py
          fi

      - name: Build Python compatibility distribution
        run: |
          python -m pip install -U pip build twine
          python -W error::SyntaxWarning -m compileall -q src/cccc
          python -m build
          python -m twine check dist/*

      - name: Upload Python distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Download Python distribution
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Install publish dependencies
        run: python -m pip install -U pip twine

      - name: Determine repository
        id: repo
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+|(a|b|rc)[0-9]+)$ ]]; then
            echo "name=testpypi" >> "$GITHUB_OUTPUT"
            echo "url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
            echo "token=${{ secrets.TEST_PYPI_API_TOKEN }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=pypi" >> "$GITHUB_OUTPUT"
            echo "url=https://upload.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
            echo "token=${{ secrets.PYPI_API_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Python compatibility distribution to ${{ steps.repo.outputs.name }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ steps.repo.outputs.token }}
        run: python -m twine upload --repository-url "${{ steps.repo.outputs.url }}" dist/*
