name: Experimental standalone Rust preview

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify shared release identity
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/check_release_versions.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/check_release_versions.py
          fi
      - name: Build Web UI once
        run: node scripts/prepare_rust_web_assets.mjs --install-deps
      - uses: actions/upload-artifact@v7
        with:
          name: release-rust-web-bundle
          path: web/dist
          if-no-files-found: error

  build-linux:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-rust-web-bundle
          path: web/dist
      - name: Install native build dependencies
        run: dnf install -y cmake perl-core
      - name: Select Python 3.14
        run: echo "/opt/python/cp314-cp314/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-standalone
      - name: Build Rust distribution
        run: |
          touch web/dist/index.html
          cargo build --release --locked --features standalone -p cccc --bin cccc
          strip target/release/cccc
          python scripts/check_release_versions.py --rust-binary target/release/cccc
          python scripts/verify_standalone_binary.py --platform linux target/release/cccc
      - name: Package Linux distribution
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          package="cccc-v${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          cp target/release/cccc "dist/${package}/"
          cp LICENSE README.md docs/rust-migration.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v7
        with:
          name: cccc-x86_64-unknown-linux-gnu
          path: dist/*.tar.gz
          if-no-files-found: error

  build-desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-rust-web-bundle
          path: web/dist
      - name: Mark shared Web bundle current
        shell: bash
        run: touch web/dist/index.html
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build Rust distribution
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --target ${{ matrix.target }} -p cccc --bin cccc
      - name: Smoke native Rust binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/cccc"
          case "${{ matrix.target }}" in
            *-windows-*) binary="${binary}.exe" ;;
          esac
          "$binary" --version
      - name: Verify macOS dependency boundary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: python3 scripts/verify_standalone_binary.py --platform macos target/${{ matrix.target }}/release/cccc
      - name: Resolve package name
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "PACKAGE_NAME=cccc-v${version}-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Package Unix distribution
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p "dist/${PACKAGE_NAME}"
          cp target/${{ matrix.target }}/release/cccc "dist/${PACKAGE_NAME}/"
          cp LICENSE README.md docs/rust-migration.md "dist/${PACKAGE_NAME}/"
          tar -C dist -czf "dist/${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
      - name: Package Windows distribution
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = $env:PACKAGE_NAME
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cccc.exe" "dist/$name/"
          Copy-Item LICENSE,README.md,docs/rust-migration.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cccc-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  prepare:
    needs:
      - build-linux
      - build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cccc-*
          path: artifacts
          merge-multiple: true
      - name: Prepare release assets
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          scripts/package_release_assets.sh artifacts "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: cccc-release-candidate
          path: artifacts/*
          if-no-files-found: error

  verify:
    needs: prepare
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            verifier: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            verifier: unix
          - os: macos-14
            target: aarch64-apple-darwin
            verifier: unix
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            verifier: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cccc-release-candidate
          path: artifacts
      - name: Verify Unix release candidate
        if: matrix.verifier == 'unix'
        shell: bash
        run: bash scripts/tests/verify_release_unix.sh artifacts "${{ matrix.target }}"
      - name: Verify Windows release candidate
        if: matrix.verifier == 'windows'
        shell: pwsh
        run: ./scripts/tests/verify_release_windows.ps1 -ArtifactDir artifacts -Target "${{ matrix.target }}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cccc-release-candidate
          path: artifacts
      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_versions.py --tag "${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          notes_file="docs/release/v${version}_release_notes.md"
          test -f "${notes_file}"
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;;
          esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --verify-tag \
              --title "CCCC ${GITHUB_REF_NAME#v} (experimental standalone Rust preview)" \
              --notes-file "${notes_file}" \
              "${prerelease[@]}"
          fi
