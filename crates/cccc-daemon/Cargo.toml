[package]
name = "cccc-pair-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native daemon and control-plane operations for CCCC"
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
cccc-client = { package = "cccc-pair-client", version = "=0.4.61", path = "../cccc-client" }
cccc-contracts = { package = "cccc-pair-contracts", version = "=0.4.61", path = "../cccc-contracts" }
cccc-core = { package = "cccc-pair-core", version = "=0.4.61", path = "../cccc-core" }
cccc-notebooklm = { package = "cccc-pair-notebooklm", version = "=0.4.61", path = "../cccc-notebooklm" }
cccc-runtime = { package = "cccc-pair-runtime", version = "=0.4.61", path = "../cccc-runtime" }
chrono.workspace = true
fs2.workspace = true
futures-util.workspace = true
mime_guess.workspace = true
nix = { workspace = true, features = ["hostname", "signal", "process", "feature", "user"] }
percent-encoding.workspace = true
regex.workspace = true
same-file.workspace = true
reqwest.workspace = true
reqwest_mcp.workspace = true
rmcp.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
shell-words.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
url.workspace = true
webpki-roots.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
cccc-linux-memory = { path = "../cccc-linux-memory" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[lints]
workspace = true

[lib]
name = "cccc_daemon"
