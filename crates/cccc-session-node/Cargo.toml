[package]
name = "cccc-pair-session-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Device-session gateway and connector for CCCC"
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
cccc-client = { package = "cccc-pair-client", version = "=0.4.60", path = "../cccc-client" }
cccc-contracts = { package = "cccc-pair-contracts", version = "=0.4.60", path = "../cccc-contracts" }
cccc-core = { package = "cccc-pair-core", version = "=0.4.60", path = "../cccc-core" }
cccc-daemon = { package = "cccc-pair-daemon", version = "=0.4.60", path = "../cccc-daemon" }
cccc-mcp = { package = "cccc-pair-mcp", version = "=0.4.60", path = "../cccc-mcp" }
futures-util.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
iroh = { version = "=1.4.1", default-features = false, features = ["tls-aws-lc-rs"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-aws-lc-rs"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cccc-system-proxy = { version = "=0.4.60", path = "../cccc-system-proxy" }

[lints]
workspace = true

[lib]
name = "cccc_session_node"
