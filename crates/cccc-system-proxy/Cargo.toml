[package]
name = "cccc-system-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Narrow native system proxy boundary for CCCC"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
